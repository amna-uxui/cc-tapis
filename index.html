<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>cc-tapis | Digital carpets</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">


  <!-- The styles and the code below are fetched fresh on every visit (the live site would otherwise
       let phones keep an old copy for 10 minutes), so a change shows as soon as it's pushed -->
  <script>
    var fresh = Date.now();
    document.write('<link rel="stylesheet" href="css/tokens.css?' + fresh + '">');
    document.write('<link rel="stylesheet" href="css/main.css?' + fresh + '">');
  </script>
</head>
<body class="is-starting">

  <!-- Full screen: the carpet you can zoom and move around, with an arrow on each side -->
  <main class="stage" data-viewer>
    <div class="carpet">
      <img src="images/carpet-02-cacao-cut.png" alt="Plain velvet cc-tapis rug, ready to draw on" draggable="false">
      <canvas class="carpet__brush"></canvas>
      <canvas class="carpet__paint" aria-hidden="true"></canvas> <!-- Ripple Square: the ripples you draw (js/carpet-ripple.js) -->
      <canvas class="carpet__wind" aria-hidden="true"></canvas> <!-- GrandMa Patterns: the pile moving in the wind (js/carpet-blow.js) -->
      <div class="carpet__light" aria-hidden="true"></div> <!-- Hypercode: the lamp's light (js/carpet-lamp.js) -->
    </div>

    <!-- Zoomed out, a slim arrow each side of the rug, in the white beside it: there's another
         collection that way (swipe, or tap the arrow); none past the first or the last
         (js/carpet-collections.js) -->
    <button class="arrow arrow--prev" aria-label="Previous collection" data-switch="-1">
      <svg viewBox="0 0 8 16" aria-hidden="true"><path d="M7 1 1 8l6 7" /></svg>
    </button>
    <button class="arrow arrow--next" aria-label="Next collection" data-switch="1">
      <svg viewBox="0 0 8 16" aria-hidden="true"><path d="m1 1 6 7-6 7" /></svg>
    </button>
    <!-- The verb: tells you what you can do with this carpet, shown for a few seconds when the page opens -->
    <p class="verb" aria-live="polite" data-verb>To touch</p>
  </main>

  <!-- Top: grey bar like cc-tapis.com -->
  <header class="bar bar--top" data-fit-top>
    <button class="bar__side bar__side--left" aria-label="Open menu"><span class="menu-icon"></span></button>
    <span class="wordmark">cc-tapis</span>
    <a class="bar__side bar__side--right mono" href="https://cc-tapis.com/shop" target="_blank" rel="noopener" data-shop>Shop</a>
    <!-- Once a rug is bought, Shop gives way to the bag, with how many rugs are in it (js/carpet-cart.js) -->
    <button class="bar__side bar__side--right cart-bag" aria-label="Your bag" hidden data-bag>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.2 13H5.2z" /><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8" /></svg>
      <span class="cart-bag__count" data-bag-count>0</span>
    </button>
  </header>

  <!-- While the whole rug is in view, under the top bar: the lamp (left, Hypercode only); the
       rug's name, designer, size and price (centre) -->
  <div class="rug-info" data-rug-info>
    <!-- The lamp: turn it to light the rug from any side -->
    <div class="lamp-dial" role="slider" tabindex="0" aria-label="Lamp direction" aria-valuemin="0" aria-valuemax="359" data-lamp>
      <span class="lamp-dial__lamp"></span>
      <!-- the light in the room: tap the lamp to switch (js/carpet-lamp.js) -->
      <svg class="mood-icon mood-icon--evening" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.5 11a4.5 4.5 0 0 1 9 0M1.5 11h13M8 3.5v1.5M3.2 5.6l1 1M12.8 5.6l-1 1" />
      </svg>
      <svg class="mood-icon mood-icon--daylight" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="3" />
        <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" />
      </svg>
      <svg class="mood-icon mood-icon--night" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M12.5 10.2A5.2 5.2 0 0 1 5.8 3.5a5.2 5.2 0 1 0 6.7 6.7z" />
      </svg>
      <span class="lamp-dial__status mono" aria-live="polite" data-lamp-status></span>
    </div>
    <div class="rug-info__text" aria-live="polite">
      <p class="rug-info__name" data-rug-name></p>
      <p class="rug-info__designer" data-rug-designer></p>
      <p class="rug-info__size mono" data-rug-size></p>
    </div>
    <!-- Save your rug as an image (js/carpet-save.js) -->
    <button class="save-rug" aria-label="Save your rug" data-save>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" /></svg>
    </button>
  </div>

  <!-- GrandMa Patterns' wind, where Hypercode has its lamp: tap to let the rug listen to your
       breath, hold for a breath without the microphone (js/carpet-blow.js). While it listens, a
       ring round it breathes, and swells with your breath. -->
  <button class="tool tool--blow" aria-label="Blow on the rug" aria-pressed="false" data-blow>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="blow-line blow-line--1" d="M3 8h10a3 3 0 1 0-3-3" />
      <path class="blow-line blow-line--2" d="M3 12h15a3 3 0 1 1-3 3" />
      <path class="blow-line blow-line--3" d="M3 16h6" />
    </svg>
    <span class="blow-status mono" aria-live="polite" data-blow-status></span>
  </button>

  <!-- While the whole rug is in view, under it, above Buy: the row (js/carpet-strip.js),
       Hypercode's shapes or colours, GrandMa Patterns' rugs or Ripple Square's colourways -->
  <div class="rug-shapes" data-shape-options data-rug-options data-fit-under></div>
  <!-- ... and above it, on Hypercode only, which the row shows: its shapes or its colours
       (js/carpet-shapes.js) -->
  <div class="rug-tabs" role="tablist" data-rug-tabs data-fit-under>
    <button class="rug-tabs__tab mono" role="tab" aria-selected="true" data-tab="shape">Shape</button>
    <button class="rug-tabs__tab mono" role="tab" aria-selected="false" data-tab="colour">Colour</button>
  </div>

  <!-- Bottom, floating over the carpet: zoom (left), buy (centre), about this rug (right) -->
  <nav class="bar bar--bottom" data-fit-bottom>
    <!-- Zoom: switch between the close-up and the whole rug. Arrows out when you can zoom out, in when you can zoom in -->
    <button class="tool tool--zoom" aria-label="Zoom in or out" data-zoom>
      <svg class="zoom-icon zoom-icon--out" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" />
        <path d="M10 10 6 6M6 10V6h4M14 10l4-4M14 6h4v4M10 14l-4 4M6 14v4h4M14 14l4 4M18 14v4h-4" />
      </svg>
      <svg class="zoom-icon zoom-icon--in" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" />
        <path d="M6 6l4 4M10 6v4H6M18 6l-4 4M14 6v4h4M6 18l4-4M6 14h4v4M18 18l-4-4M18 14h-4v4" />
      </svg>
    </button>

    <button class="button button--wide mono" data-buy>Buy</button>

    <!-- About this rug: opens the sheet below (js/carpet-info.js); only while the whole rug is in view -->
    <button class="tool info-button" aria-label="About this rug" aria-expanded="false" data-info>
      <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2H2v20h5M17 2h5v20h-5M12 7v10M7 12h10" /></svg>
    </button>
  </nav>

  <!-- About this rug: a sheet sliding up from below, in the grey of the top bar, with the whole
       rug, a few words about it, and its description, details and customisation (js/carpet-info.js) -->
  <!-- Buying (js/carpet-cart.js): while the rug rolls up and away, nothing else reacts -->
  <div class="cart-shield" data-cart-shield></div>
  <!-- The bag: the rugs in it, each with [–] to take it out, the total, and check out -->
  <div class="cart-backdrop" data-cart-backdrop></div>
  <section class="cart-sheet mono" aria-label="Your bag" aria-hidden="true" data-cart-sheet>
    <div class="cart-rule"><span class="cart-rule__line" aria-hidden="true"></span><button class="cart-rule__close mono" data-cart-close>Close</button><span class="cart-rule__line" aria-hidden="true"></span></div>
    <div class="cart-sheet__scroll" data-cart-list></div>
  </section>
  <!-- Checked out: the end of the journey -->
  <section class="cart-thanks mono" aria-hidden="true" data-cart-thanks></section>

  <div class="info-backdrop" data-info-backdrop></div>
  <section class="info-sheet" aria-label="About this rug" aria-hidden="true" data-info-sheet>
    <div class="info-sheet__top">
      <span class="info-sheet__title">About this rug</span>
      <button class="tool info-sheet__close" aria-label="Close" data-info-close>
        <svg class="info-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2H2v20h5M17 2h5v20h-5M7 12h10" /></svg>
      </button>
    </div>
    <div class="info-sheet__scroll" data-info-scroll></div>
  </section>

  <script>
    [
      "js/carpet-viewer.js",
      "js/carpet-strip.js",
      "js/carpet-colors.js",
      "js/carpet-shapes.js",
      "js/carpet-lamp.js",
      "js/carpet-sound.js",
      "js/carpet-save.js",
      "js/carpet-menu.js",
      "js/carpet-wind-sound.js",
      "js/carpet-blow.js",
      "js/carpet-rugs.js",
      "js/carpet-ripple-sound.js",
      "js/carpet-ripple.js",
      "js/carpet-info.js",
      "js/carpet-cart.js",
      "js/carpet-collections.js",
    ].forEach(function (src) { document.write('<script src="' + src + '?' + fresh + '"><\/script>'); });
  </script>
</body>
</html>
