<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>cc-tapis | Digital carpets</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script>
    // The page slide (css/main.css): opened by a swipe from another collection (js/carpet-menu.js),
    // this page slides in from that side. Set before the page shows; cleared once it has slid in.
    (function () {
      var root = document.documentElement;
      try {
        var slide = sessionStorage.getItem("cc-slide");
        sessionStorage.removeItem("cc-slide");
        if (slide) root.dataset.slide = slide;
      } catch (e) {}
      function done() { delete root.dataset.slide; }
      addEventListener("pagereveal", function (e) {
        if (!e.viewTransition) return done();
        e.viewTransition.ready.catch(function () {}); // skipped (e.g. a hidden tab): nothing to slide
        e.viewTransition.finished.then(done, done);
      });
      setTimeout(done, 1500);
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Full screen: the carpet you can zoom and move around, with an arrow on each side -->
  <main class="stage" data-viewer>
    <div class="carpet">
      <img src="images/carpet-02-cacao-cut.png" alt="Plain velvet cc-tapis rug, ready to draw on" draggable="false">
      <canvas class="carpet__brush"></canvas>
      <div class="carpet__light" aria-hidden="true"></div> <!-- the lamp's light (js/carpet-lamp.js) -->
    </div>

    <!-- Arrows, taken out for now (their styles are still in css/main.css):
    <button class="arrow arrow--prev mono" aria-label="Previous carpet">←</button>
    <button class="arrow arrow--next mono" aria-label="Next carpet">→</button>
    -->
    <!-- The verb: tells you what you can do with this carpet, shown for a few seconds when the page opens -->
    <p class="verb" aria-live="polite">To draw</p>
  </main>

  <!-- Top: grey bar like cc-tapis.com -->
  <header class="bar bar--top" data-fit-top>
    <button class="bar__side bar__side--left" aria-label="Open menu"><span class="menu-icon"></span></button>
    <span class="wordmark">cc-tapis</span>
    <a class="bar__side bar__side--right mono" href="https://cc-tapis.com/shop" target="_blank" rel="noopener">Shop</a>
  </header>

  <!-- While the whole rug is in view, under the top bar: the lamp (left); collection name, size
       and price (centre) -->
  <div class="rug-info" data-rug-info>
    <!-- The lamp: turn it to light the rug from any side -->
    <div class="lamp-dial" role="slider" tabindex="0" aria-label="Lamp direction" aria-valuemin="0" aria-valuemax="359" data-lamp>
      <span class="lamp-dial__lamp"></span>
      <!-- the light in the room: tap the lamp to switch (js/carpet-lamp.js) -->
      <svg class="mood-icon mood-icon--evening" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3.5 11a4.5 4.5 0 0 1 9 0M1.5 11h13M8 3.5v1.5M3.2 5.6l1 1M12.8 5.6l-1 1" />
      </svg>
      <svg class="mood-icon mood-icon--daylight" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="3" />
        <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" />
      </svg>
      <svg class="mood-icon mood-icon--night" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M12.5 10.2A5.2 5.2 0 0 1 5.8 3.5a5.2 5.2 0 1 0 6.7 6.7z" />
      </svg>
      <span class="lamp-dial__status mono" aria-live="polite" data-lamp-status></span>
    </div>
    <div class="rug-info__text" aria-live="polite">
      <p class="rug-info__name" data-rug-name></p>
      <p class="rug-info__designer" data-rug-designer></p>
      <p class="rug-info__size mono" data-rug-size></p>
    </div>
    <!-- Save your rug as an image (js/carpet-save.js) -->
    <button class="save-rug" aria-label="Save your rug" data-save>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" /></svg>
    </button>
  </div>

  <!-- While the whole rug is in view, under it, above Buy: the shapes to choose from -->
  <div class="rug-shapes" data-shape-options></div>

  <!-- Bottom, floating over the carpet: zoom (left), buy (centre), colour (right) -->
  <nav class="bar bar--bottom" data-fit-bottom>
    <!-- Zoom: switch between the close-up and the whole rug. Arrows out when you can zoom out, in when you can zoom in -->
    <button class="tool tool--zoom" aria-label="Zoom in or out" data-zoom>
      <svg class="zoom-icon zoom-icon--out" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" />
        <path d="M10 10 6 6M6 10V6h4M14 10l4-4M14 6h4v4M10 14l-4 4M6 14v4h4M14 14l4 4M18 14v4h-4" />
      </svg>
      <svg class="zoom-icon zoom-icon--in" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" />
        <path d="M6 6l4 4M10 6v4H6M18 6l-4 4M14 6v4h4M6 18l4-4M6 14h4v4M18 18l-4-4M18 14h-4v4" />
      </svg>
    </button>

    <button class="button button--wide mono">Buy</button>

    <button class="tool tool--color" aria-label="Colour of the carpet" aria-expanded="false"></button>
  </nav>

  <!-- Colours: float up above the colour circle when you tap it -->
  <div class="palette" data-palette aria-hidden="true">
    <div class="palette__sheet" data-palette-swatches></div>
  </div>

  <script src="js/carpet-viewer.js"></script>
  <script src="js/carpet-colors.js"></script>
  <script src="js/carpet-shapes.js"></script>
  <script src="js/carpet-lamp.js"></script>
  <script src="js/carpet-sound.js"></script>
  <script src="js/carpet-save.js"></script>
  <script src="js/carpet-menu.js"></script>
</body>
</html>
